# Nombre que tendrá el workflow dentro de GitHub Actions
name: Comprobar programa Python

# Evento que iniciará automáticamente el workflow
# En este caso se ejecutará cada vez que se realice un push
on:
  push:

# Aquí se definen los trabajos que ejecutará GitHub Actions
jobs:

  # Nombre interno del primer trabajo
  verificar:

    # Sistema operativo donde se ejecutará el trabajo
    runs-on: ubuntu-latest

    # Lista de pasos que realizará el trabajo
    steps:

      # PASO 1
      # Descargar dentro del runner el contenido del repositorio
      - name: Obtener repositorio
        uses: actions/checkout@v7

      # PASO 2
      # Preparar Python dentro del entorno de ejecución
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          # Versión de Python que utilizará este trabajo
          python-version: '3.14'

      # PASO 3
      # Comprobar que programa.py existe dentro del repositorio
      - name: Verificar archivo
        run: test -f programa.py

      # PASO 4
      # Comprobar que programa.py no tenga errores de sintaxis
      - name: Verificar sintaxis
        run: python -m py_compile programa.py

      # PASO 5
      # Ejecutar realmente el programa
      - name: Ejecutar programa
        run: python programa.py

      # PASO 6
      # Guardar la salida del programa y comprobar
      # que contenga el resultado TOTAL: 24
      - name: Comprobar resultado esperado
        run: |
          python programa.py > salida.txt
          grep "TOTAL: 24" salida.txt
